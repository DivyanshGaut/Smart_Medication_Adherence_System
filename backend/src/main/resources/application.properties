server.port=8080

# H2 Database configuration with persistent file storage
spring.datasource.url=jdbc:h2:file:./data/adherence_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
app.jwt.secret=elowenSmartMedicationAdherenceSecureSecretKey2026MustBeAtLeast256BitsLong
app.jwt.expiration-ms=86400000
